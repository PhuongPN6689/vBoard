<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="radialGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Keycap Gradients -->
    <linearGradient id="keyBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0E17"/>
    </linearGradient>

    <linearGradient id="keyFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243248"/>
      <stop offset="50%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="keyStrokeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.18"/>
    </linearGradient>

    <!-- V Monogram Left Arm Gradient (Cyan to Blue) -->
    <linearGradient id="vLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="60%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- V Monogram Right Arm Gradient (Violet to Pink) -->
    <linearGradient id="vRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="40%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Accent Tone Mark Gradient (Gold / Amber) -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Spacebar Pill Gradient -->
    <linearGradient id="spacebarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="keyShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0EA5E9" flood-opacity="0.45"/>
    </filter>

    <filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Master Background Canvas -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <circle cx="512" cy="460" r="420" fill="url(#radialGlow)"/>

  <!-- 2. Keyboard Keycap Body -->
  <!-- Bevel Shadow Base -->
  <rect x="180" y="180" width="664" height="664" rx="150" fill="url(#keyBaseGrad)" filter="url(#keyShadow)"/>
  <!-- Top Elevated Face -->
  <rect x="186" y="174" width="652" height="652" rx="146" fill="url(#keyFaceGrad)" stroke="url(#keyStrokeGrad)" stroke-width="2.5"/>

  <!-- Inner Subtle Specular Arc -->
  <path d="M 236 210 Q 512 188 788 210" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25" fill="none" stroke-linecap="round"/>

  <!-- 3. Stylized 'V' Monogram with Vietnamese Accent Mark -->
  <g filter="url(#glowFilter)">
    <!-- Left Wing of 'V' -->
    <path d="M 334 350 
             C 334 330 354 316 374 322 
             L 434 340 
             C 450 345 460 360 464 376 
             L 512 590 
             L 426 620 
             L 340 376 
             C 336 368 334 359 334 350 Z" 
          fill="url(#vLeftGrad)"/>

    <!-- Right Wing of 'V' (Overlapping) -->
    <path d="M 690 350 
             C 690 330 670 316 650 322 
             L 590 340 
             C 574 345 564 360 560 376 
             L 512 590 
             L 598 620 
             L 684 376 
             C 688 368 690 359 690 350 Z" 
          fill="url(#vRightGrad)"/>

    <!-- Center Vertex Connector -->
    <path d="M 440 595 
             L 512 675 
             C 517 680 525 680 530 675 
             L 584 595 
             L 512 555 Z" 
          fill="#38BDF8"/>
  </g>

  <!-- 4. Vietnamese Diacritic Tone Mark (Dấu Sắc / Spark of Velocity) -->
  <g filter="url(#accentGlow)">
    <path d="M 505 278 
             C 498 274 496 264 502 258 
             L 556 204 
             C 564 196 578 198 582 208 
             L 588 222 
             C 592 230 588 240 580 246 
             L 524 282 
             C 518 286 510 282 505 278 Z" 
          fill="url(#accentGrad)"/>
  </g>

  <!-- 5. Keyboard Spacebar Track & Dots -->
  <rect x="362" y="722" width="300" height="14" rx="7" fill="url(#spacebarGrad)"/>
  <circle cx="318" cy="729" r="6" fill="#38BDF8" fill-opacity="0.45"/>
  <circle cx="706" cy="729" r="6" fill="#F43F5E" fill-opacity="0.45"/>
</svg>
