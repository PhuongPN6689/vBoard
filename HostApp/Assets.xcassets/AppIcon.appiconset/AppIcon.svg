<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5F7FA"/>
      <stop offset="100%" stop-color="#E2E7F0"/>
    </linearGradient>

    <!-- Keyboard Body Platform (Gboard Card Surface) -->
    <linearGradient id="kbPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F4F9"/>
      <stop offset="100%" stop-color="#DEE4EE"/>
    </linearGradient>

    <!-- Keycap Face Gradients -->
    <linearGradient id="keyWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="keySpecial" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E7F0"/>
      <stop offset="100%" stop-color="#D0D8E6"/>
    </linearGradient>

    <!-- VIỆT NAM QUỐC KỲ: ĐỎ THẮM & VÀNG SAO -->
    <!-- Dải Lụa Chữ V Liền Mạch (Continuous Dynamic Ribbon) -->
    <linearGradient id="vnVGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="25%" stop-color="#E11D48"/>
      <stop offset="42%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="58%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Sắc Vàng Kim Ngôi Sao Tỏa Sáng -->
    <linearGradient id="starGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Phím Enter Đỏ Son Rực Rỡ -->
    <linearGradient id="returnRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Shadows & Lighting -->
    <filter id="kbCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#334155" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <filter id="keycapShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#64748B" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.06"/>
    </filter>

    <filter id="vRibbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#881337" flood-opacity="0.36"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>

    <filter id="starGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Full Canvas Background -->
  <rect width="1024" height="1024" fill="url(#canvasBg)"/>

  <!-- 2. Keyboard Body Platform (Gboard Floating Slab) -->
  <rect x="64" y="88" width="896" height="848" rx="100" fill="url(#kbPlate)" filter="url(#kbCardShadow)"/>
  <rect x="65" y="89" width="894" height="846" rx="99" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.9"/>

  <!-- 3. GBOARD SIGNATURE SUGGESTION BAR (Top Row) -->
  <g filter="url(#keycapShadow)">
    <rect x="96" y="126" width="832" height="74" rx="22" fill="#E2E7F0" fill-opacity="0.85"/>
    
    <!-- Left Tools Button with 4 Vietnamese Red & Gold Dots -->
    <rect x="108" y="137" width="52" height="52" rx="16" fill="url(#keyWhite)"/>
    <circle cx="126" cy="155" r="4.2" fill="#E11D48"/>
    <circle cx="142" cy="155" r="4.2" fill="#F59E0B"/>
    <circle cx="126" cy="171" r="4.2" fill="#F59E0B"/>
    <circle cx="142" cy="171" r="4.2" fill="#E11D48"/>

    <!-- Left Brand Label: "vBoard" -->
    <text x="236" y="172" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="700" fill="#64748B" letter-spacing="0.5" text-anchor="middle">vBoard</text>

    <!-- Center Active Suggestion Pill: "Tiếng Việt" (Trang trọng, hoàn hảo không bị che) -->
    <rect x="332" y="135" width="360" height="56" rx="18" fill="url(#keyWhite)" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Cờ đỏ sao vàng mini trang nhã -->
    <rect x="356" y="147" width="32" height="22" rx="4" fill="#DC2626"/>
    <polygon points="372,152 374,158 380,158 375,162 377,168 372,164 367,168 369,162 364,158 370,158" fill="#FBBF24"/>
    <text x="536" y="172" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="26" font-weight="700" fill="#E11D48" letter-spacing="1" text-anchor="middle">Tiếng Việt</text>

    <!-- Right Mic / Voice Button -->
    <rect x="864" y="137" width="52" height="52" rx="16" fill="url(#keyWhite)"/>
    <rect x="886" y="149" width="8" height="15" rx="4" fill="#E11D48"/>
    <path d="M 882 160 C 882 166 886 170 890 170 C 894 170 898 166 898 160" fill="none" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="890" y1="170" x2="890" y2="176" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 4. KEYBOARD KEYCAP GRID -->
  <!-- Row 1 Alpha (Q - P) -->
  <g filter="url(#keycapShadow)">
    <rect x="96"  y="226" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="180" y="226" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="264" y="226" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="348" y="226" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="432" y="226" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="516" y="226" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="600" y="226" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="684" y="226" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="768" y="226" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="852" y="226" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
  </g>

  <!-- Row 2 Alpha (A - L) -->
  <g filter="url(#keycapShadow)">
    <rect x="138" y="372" width="78" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="224" y="372" width="78" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="310" y="372" width="78" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="396" y="372" width="78" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="482" y="372" width="78" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="568" y="372" width="78" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="654" y="372" width="78" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="740" y="372" width="78" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="826" y="372" width="78" height="124" rx="22" fill="url(#keyWhite)"/>
  </g>

  <!-- Row 3: Shift, Z - M, Delete -->
  <g filter="url(#keycapShadow)">
    <rect x="96"  y="518" width="112" height="124" rx="22" fill="url(#keySpecial)"/>
    <path d="M 152 562 L 168 578 L 160 578 L 160 598 L 144 598 L 144 578 L 136 578 Z" fill="#64748B"/>

    <rect x="220" y="518" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="304" y="518" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="388" y="518" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="472" y="518" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="556" y="518" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="640" y="518" width="76" height="124" rx="22" fill="url(#keyWhite)"/>
    <rect x="724" y="518" width="76" height="124" rx="22" fill="url(#keyWhite)"/>

    <rect x="816" y="518" width="112" height="124" rx="22" fill="url(#keySpecial)"/>
    <path d="M 884 564 L 858 580 L 884 596 Z M 884 564 L 892 564 C 896 564 898 566 898 570 L 898 590 C 898 594 896 596 892 596 L 884 596 Z" fill="#64748B"/>
    <path d="M 874 574 L 886 586 M 886 574 L 874 586" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Row 4: 123, Spacebar, Return -->
  <g filter="url(#keycapShadow)">
    <rect x="96" y="664" width="128" height="124" rx="24" fill="url(#keySpecial)"/>
    <text x="160" y="738" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="34" font-weight="600" fill="#475569" text-anchor="middle">123</text>

    <!-- Spacebar Keycap -->
    <rect x="238" y="664" width="536" height="124" rx="24" fill="url(#keyWhite)"/>
    <text x="506" y="736" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="30" font-weight="600" fill="#475569" letter-spacing="2" text-anchor="middle">vBoard</text>

    <!-- Return Keycap in Vietnamese Red -->
    <rect x="788" y="664" width="140" height="124" rx="24" fill="url(#returnRed)"/>
    <path d="M 868 714 L 868 732 L 840 732 M 848 724 L 840 732 L 848 740" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 5. GLIDE SWIPE TRAIL VÀNG SAO (Golden Swipe Curve) -->
  <path d="M 284 320 Q 380 530 512 746 Q 644 530 740 320" 
        fill="none" stroke="#F59E0B" stroke-width="14" stroke-linecap="round" opacity="0.32"/>
  <circle cx="284" cy="320" r="9" fill="#E11D48"/>
  <circle cx="512" cy="746" r="9" fill="#F59E0B"/>
  <circle cx="740" cy="320" r="9" fill="#E11D48"/>

  <!-- 6. MASTERPIECE 'V' VIỆT NAM (TỰ DO, PHÓNG KHOÁNG, KHÔNG DẤU SẮC) -->
  <g filter="url(#vRibbonShadow)">
    <path d="M 292 250
             C 264 250 246 276 256 302
             L 426 734
             C 438 760 466 776 496 774
             C 524 772 550 754 562 728
             L 768 302
             C 778 276 760 250 732 250
             C 706 250 686 276 678 298
             L 512 648
             L 346 298
             C 338 276 318 250 292 250
             Z"
          fill="url(#vnVGradient)"/>
  </g>

  <!-- Ánh sáng kim cương phản chiếu trên gờ nổi viền chữ V (mềm mại, tinh tế) -->
  <path d="M 302 268 L 448 682" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M 722 268 L 576 682" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Tâm đáy chữ V: Ngôi Sao Vàng Tổ Quốc Đặc Sắc Việt Nam Tỏa Sáng Tinh Tế -->
  <g filter="url(#starGlow)" transform="translate(512, 652)">
    <circle cx="0" cy="0" r="28" fill="#F59E0B" opacity="0.45"/>
    <g transform="scale(2.2)">
      <polygon points="0,-12 3.5,-4 12,-4 5,2 7.5,10 0,5 -7.5,10 -5,2 -12,-4 -3.5,-4" fill="url(#starGoldGrad)"/>
    </g>
  </g>
</svg>
